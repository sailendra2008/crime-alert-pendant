<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESP32-C3 Super Mini — Web Bluetooth Pendant Tester</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #ef4444;
      --green: #10b981;
      --border: #334155;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px;
    }
    .container {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .header {
      text-align: center;
      margin-top: 10px;
    }
    .tag {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    h1 {
      font-size: 26px;
      font-weight: 800;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }
    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .badge {
      padding: 6px 12px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 700;
      background: #334155;
      color: #94a3b8;
    }
    .badge.connected {
      background: rgba(16, 185, 129, 0.2);
      color: var(--green);
      border: 1px solid var(--green);
    }
    .badge.alert {
      background: rgba(239, 68, 68, 0.2);
      color: var(--accent);
      border: 1px solid var(--accent);
      animation: pulse 1s infinite;
    }
    .btn-group {
      display: flex;
      gap: 10px;
    }
    button {
      flex: 1;
      padding: 12px 18px;
      border-radius: 10px;
      border: none;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn-primary {
      background: #3b82f6;
      color: white;
    }
    .btn-primary:hover {
      background: #2563eb;
    }
    .btn-danger {
      background: var(--accent);
      color: white;
    }
    .btn-danger:hover {
      background: #dc2626;
    }
    .btn-secondary {
      background: #334155;
      color: var(--text);
    }
    .btn-secondary:hover {
      background: #475569;
    }
    /* SOS Screen */
    .sos-container {
      text-align: center;
      padding: 30px 10px;
    }
    .sos-button {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      background: var(--accent);
      color: white;
      border: none;
      font-size: 38px;
      font-weight: 900;
      box-shadow: 0 0 25px rgba(239, 68, 68, 0.5);
      cursor: pointer;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s;
    }
    .sos-button.alarm {
      animation: sosPulse 0.5s infinite alternate;
    }
    .sos-button span {
      font-size: 12px;
      letter-spacing: 1px;
      margin-top: 4px;
      font-weight: 600;
    }
    @keyframes sosPulse {
      from { transform: scale(1); box-shadow: 0 0 20px rgba(239, 68, 68, 0.5); }
      to { transform: scale(1.1); box-shadow: 0 0 50px rgba(239, 68, 68, 0.9); }
    }
    .console {
      background: #090d16;
      border: 1px solid #1e293b;
      border-radius: 10px;
      padding: 12px;
      font-family: monospace;
      font-size: 12px;
      height: 160px;
      overflow-y: auto;
      color: #cbd5e1;
      display: flex;
      flex-direction: column-reverse;
    }
    .log-line {
      margin-bottom: 4px;
    }
    .log-line.alert {
      color: #f87171;
      font-weight: bold;
    }
    .log-line.success {
      color: #34d399;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="tag">Crime Alert System • Web BLE Console</div>
      <h1>ESP32-C3 Pendant Monitor</h1>
    </div>

    <div class="card">
      <div class="status-row">
        <div>
          <h3 id="devName">Device: Not Connected</h3>
          <p style="color: var(--muted); font-size: 12px;">Push button wired to GPIO4 &amp; GND</p>
        </div>
        <div id="statusBadge" class="badge">OFFLINE</div>
      </div>

      <div class="btn-group">
        <button id="connectBtn" class="btn-primary" onclick="connectBle()">Pair &amp; Connect ESP32</button>
        <button id="disconnectBtn" class="btn-secondary" onclick="disconnectBle()" disabled>Disconnect</button>
      </div>
    </div>

    <div class="card sos-container">
      <button id="sosBtn" class="sos-button" onclick="manualSimulateClick()">
        SOS
        <span id="sosSub">CLICK GPIO4</span>
      </button>

      <div id="alertBanner" style="margin-top: 20px; display: none;">
        <h2 style="color: var(--accent); margin-bottom: 6px;">🚨 GPIO4 ALERT TRIGGERED!</h2>
        <p style="color: var(--muted); font-size: 14px;">Incoming BLE signal received from ESP32-C3 Super Mini.</p>
        <button class="btn-secondary" style="margin-top: 14px; max-width: 200px;" onclick="resetAlert()">Silence &amp; Reset</button>
      </div>
    </div>

    <div class="card">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
        <span style="font-size: 12px; font-weight: bold; color: var(--muted); text-transform: uppercase;">Live BLE Event Log</span>
        <button onclick="clearLogs()" style="background:none; border:none; color:var(--muted); font-size:12px; cursor:pointer;">Clear</button>
      </div>
      <div id="consoleLog" class="console">
        <div class="log-line">Ready. Click 'Pair &amp; Connect ESP32' to begin Web BLE link.</div>
      </div>
    </div>
  </div>

  <script>
    const SERVICE_UUID = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
    const SOS_CHAR_UUID = "beb5483e-36e1-4688-b7f5-ea07361b26a8";

    let bleDevice = null;
    let sosChar = null;
    let audioCtx = null;

    function log(msg, type = "") {
      const consoleEl = document.getElementById("consoleLog");
      const time = new Date().toLocaleTimeString();
      const div = document.createElement("div");
      div.className = "log-line " + type;
      div.textContent = `[${time}] ${msg}`;
      consoleEl.prepend(div);
    }

    function clearLogs() {
      document.getElementById("consoleLog").innerHTML = "";
    }

    function playBeep() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sawtooth";
        osc.frequency.setValueAtTime(880, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.5);
      } catch (e) {
        console.error(e);
      }
    }

    async function connectBle() {
      if (!navigator.bluetooth) {
        alert("Web Bluetooth is not supported in this browser. Please use Google Chrome or Microsoft Edge.");
        return;
      }

      try {
        log("Requesting Bluetooth device matching 'CrimeAlertPendant'...");
        bleDevice = await navigator.bluetooth.requestDevice({
          filters: [
            { name: "CrimeAlertPendant" },
            { services: [SERVICE_UUID] }
          ],
          optionalServices: [SERVICE_UUID]
        });

        bleDevice.addEventListener('gattserverdisconnected', onDisconnected);
        log(`Connecting to GATT Server on ${bleDevice.name}...`);
        const server = await bleDevice.gatt.connect();

        log("Discovering safety service...");
        const service = await server.getPrimaryService(SERVICE_UUID);

        log("Getting SOS characteristic...");
        sosChar = await service.getCharacteristic(SOS_CHAR_UUID);

        await sosChar.startNotifications();
        sosChar.addEventListener('characteristicvaluechanged', handleSosNotification);

        document.getElementById("devName").textContent = `Device: ${bleDevice.name}`;
        const badge = document.getElementById("statusBadge");
        badge.textContent = "CONNECTED";
        badge.className = "badge connected";
        document.getElementById("connectBtn").disabled = true;
        document.getElementById("disconnectBtn").disabled = false;

        log("Subscribed to SOS notifications from ESP32 GPIO4!", "success");
      } catch (err) {
        log("Connection error: " + err.message, "alert");
      }
    }

    function handleSosNotification(event) {
      const value = event.target.value.getUint8(0);
      log(`Notification received: 0x0${value.toString(16)}`, "alert");

      if (value === 1) {
        triggerSosAlarm("ESP32-C3 Push Button (GPIO4)");
      }
    }

    function triggerSosAlarm(source) {
      playBeep();
      const sosBtn = document.getElementById("sosBtn");
      sosBtn.classList.add("alarm");
      document.getElementById("sosSub").textContent = "ALERT ACTIVE";
      document.getElementById("alertBanner").style.display = "block";
      const badge = document.getElementById("statusBadge");
      badge.textContent = "ALERT!";
      badge.className = "badge alert";
      log(`🚨 SOS EVENT DETECTED from ${source}!`, "alert");
    }

    function manualSimulateClick() {
      triggerSosAlarm("Manual Browser Click");
    }

    function resetAlert() {
      const sosBtn = document.getElementById("sosBtn");
      sosBtn.classList.remove("alarm");
      document.getElementById("sosSub").textContent = "CLICK GPIO4";
      document.getElementById("alertBanner").style.display = "none";
      const badge = document.getElementById("statusBadge");
      if (bleDevice && bleDevice.gatt.connected) {
        badge.textContent = "CONNECTED";
        badge.className = "badge connected";
      } else {
        badge.textContent = "OFFLINE";
        badge.className = "badge";
      }
      log("Alert dismissed.");
    }

    function disconnectBle() {
      if (bleDevice && bleDevice.gatt.connected) {
        bleDevice.gatt.disconnect();
      }
    }

    function onDisconnected() {
      document.getElementById("devName").textContent = "Device: Not Connected";
      const badge = document.getElementById("statusBadge");
      badge.textContent = "DISCONNECTED";
      badge.className = "badge";
      document.getElementById("connectBtn").disabled = false;
      document.getElementById("disconnectBtn").disabled = true;
      log("ESP32 disconnected.");
    }
  </script>
</body>
</html>
